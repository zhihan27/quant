# 此文件放入 nginx.conf 的 http 块内，替换域名及证书路径后执行 nginx -t。
# 仅允许 Nginx 访问 127.0.0.1:8501，不能通过开放8501绕过防护。
map $http_upgrade $quant_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=quant_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=quant_handshakes:10m rate=5r/m;
limit_req_zone $server_name zone=quant_total_requests:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=quant_connections:10m;
limit_conn_zone $server_name zone=quant_total_connections:1m;

server {
    listen 80;
    server_name quant.example.com;
    return 301 https://quant.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name quant.example.com;
    ssl_certificate /etc/letsencrypt/live/quant.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quant.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:quant_tls:10m;
    server_tokens off;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn quant_connections 10;
    limit_conn quant_total_connections 100;
    limit_req zone=quant_requests burst=150 nodelay;
    limit_req zone=quant_total_requests burst=200 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖所有来源头，应用只在 QUANT_TRUST_PROXY=1 时读取 X-Real-IP。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $quant_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    location = /_stcore/stream {
        # WebSocket 只限制握手频率，连接内登录提交由数据库限流兜底。
        limit_req zone=quant_handshakes burst=5 nodelay;
        limit_req zone=quant_total_requests burst=200 nodelay;
        limit_conn quant_connections 5;
        limit_conn quant_total_connections 100;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $quant_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    location ~ /\. {
        deny all;
    }
}

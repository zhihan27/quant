# 项目目录启动时与根目录入口使用相同的主题。
[server]
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1
maxMessageSize = 10

[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#087f8c"
backgroundColor = "#f4f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#172b4d"
font = "sans serif"
